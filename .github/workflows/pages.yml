name: Publicar efood

on:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar o efood completo
        run: |
          site="$RUNNER_TEMP/site"
          redirect="$RUNNER_TEMP/efood-redirect.html"
          cp site/index.html "$redirect"
          git switch --detach origin/efood_checkout
          npm ci
          npm run build -- --outDir "$site"
          for path in efood_layout efood_api efood_carrinho efood_checkout; do
            mkdir -p "$site/$path"
            cp "$redirect" "$site/$path/index.html"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
